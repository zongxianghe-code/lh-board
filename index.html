<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0b1220"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<meta name="apple-mobile-web-app-title" content="生猪LH"/>
<title>生猪 LH</title>
<link rel="manifest" href="manifest.json?v=202611061718"/>
<style>
:root{--bg:#0b1220;--card:#162033;--text:#eef3fb;--muted:#9aa8bf;--win:#3dd68c;--loss:#f07178;--warn:#ffb454;--line:#2a3a55;--accent:#59a5ff;--blue:#3b82f6;--head:#1a2740;--sug:#f07178}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);padding:16px;padding-bottom:64px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 8px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px;font-size:13px}
.nav a{color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.k{color:var(--muted);font-size:12px}
.v{font-size:clamp(22px,7vw,34px);font-weight:750;margin-top:6px;overflow-wrap:anywhere;line-height:1.15}
.win{color:var(--win)}.loss{color:var(--loss)}.warn{color:var(--warn)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row:last-child{border:0}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:4px}
.pill.main{background:#1a3358;color:var(--accent)}
.pill.pos{background:rgba(240,113,120,.18);color:var(--sug)}
button.refresh{display:block;width:100%;border:0;background:var(--accent);color:#041018;font-weight:700;border-radius:14px;padding:16px 20px;font-size:18px;min-height:56px;margin:12px 0 16px}
.status{font-size:12px;color:var(--muted);margin-bottom:8px}
.tiny{font-size:11px;color:var(--muted)}
.chg.up,.posc{color:var(--loss)}.chg.down,.negc{color:var(--win)}
table.chain{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
table.chain th,table.chain td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.chain th:first-child,table.chain td:first-child{text-align:left}
table.chain th{color:var(--muted);font-weight:600}
table.chain tr.main td{background:#1c2b44;font-weight:700}
table.chain tr.hold td{background:rgba(240,113,120,.10)}
table.chain tr.main.hold td{background:rgba(89,165,255,.16)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
h2{font-size:15px;margin:0 0 8px;font-weight:700}
svg.curve{width:100%;height:auto;display:block;background:#0f1828;border-radius:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.grid2 .card{margin:0}
</style>
</head>
<body>
<h1>生猪 LH</h1>
<div class="sub">大商所生猪期货 · 手机盘口</div>
<div class="nav">
  <a href="https://zongxianghe-code.github.io/mo-iron-eagle/">MO 铁鹰</a>
</div>
<div class="status" id="status">加载中…</div>
<button class="refresh" id="btn" type="button">刷新</button>
<div class="sub" id="sessHint">行情文件约每 5 分钟更新（日盘）。点刷新会整页重载（躲开桌面图标缓存）。生猪无夜盘。</div>

<div class="grid2" id="hero"></div>
<div class="card" id="posCard"></div>
<div class="card">
  <h2>合约行情</h2>
  <div class="tiny">红底 = 持仓 LH2705 · 蓝底 = 主力 LH2701</div>
  <div class="scrollx"><table class="chain">
    <thead><tr><th>合约</th><th>最新</th><th>涨跌</th><th>开</th><th>高</th><th>低</th><th>量</th><th>仓</th><th>买/卖</th></tr></thead>
    <tbody id="tb"></tbody>
  </table></div>
  <div class="note" id="tblFoot"></div>
</div>
<div class="card">
  <h2>期限结构（最新价）</h2>
  <div id="chart"></div>
</div>
<div class="card note">联动「生猪期货相关」日简报；本页仅展示行情与持仓浮盈，非投资建议。</div>

<script>
const APP_VER='202611061718';
const FALLBACK={
  updatedAt:'2026-11-06 15:05 Asia/Shanghai',
  source:'cache',
  contracts:[
    {symbol:'LH2611',last:8045,open:8035,high:8045,low:8035,settle:8040,change:5,changePct:0.06,volume:32,oi:2,bid:8000,ask:8500,isMain:false,isPosition:false},
    {symbol:'LH2701',last:9195,open:9115,high:9250,low:9060,settle:9175,change:20,changePct:0.22,volume:173362,oi:142944,bid:9190,ask:9195,isMain:true,isPosition:false},
    {symbol:'LH2703',last:9160,open:9060,high:9195,low:9035,settle:9135,change:25,changePct:0.27,volume:161150,oi:62419,bid:9160,ask:9165,isMain:false,isPosition:false},
    {symbol:'LH2705',last:10065,open:10030,high:10125,low:9980,settle:10050,change:15,changePct:0.15,volume:63780,oi:20289,bid:10055,ask:10065,isMain:false,isPosition:true},
    {symbol:'LH2707',last:11220,open:11285,high:11350,low:11170,settle:11230,change:-10,changePct:-0.09,volume:44765,oi:10575,bid:11215,ask:11220,isMain:false,isPosition:false},
    {symbol:'LH2709',last:12315,open:12450,high:12490,low:12250,settle:12345,change:-30,changePct:-0.24,volume:40103,oi:13801,bid:12315,ask:12320,isMain:false,isPosition:false},
    {symbol:'LH0',last:9195,open:9115,high:9250,low:9060,settle:9175,change:20,changePct:0.22,volume:173362,oi:142944,bid:9190,ask:9195,isMain:false,isPosition:false}
  ],
  position:{symbol:'LH2705',side:'long',lots:7,cost:12000,multiplier:16}
};
let snap=JSON.parse(JSON.stringify(FALLBACK)), live=false, timer=null;

function yen(n){const neg=n<0;const s=Math.round(Math.abs(n)).toLocaleString('en-US');return (neg?'-':'')+'¥'+s;}
function fmt(n,d=0){if(n==null||isNaN(n)) return '—'; return (+n).toFixed(d);}
function fmtInt(n){if(n==null||isNaN(n)) return '—'; return Math.round(+n).toLocaleString('en-US');}

function shanghaiNow(){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date());
  const g={}; for(const p of parts) if(p.type!=='literal') g[p.type]=p.value;
  const hour=+g.hour%24, minute=+g.minute, second=+g.second;
  const mins=hour*60+minute;
  const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g.weekday);
  return {hour,minute,second,mins,weekday:wd,label:`${g.year}-${g.month}-${g.day} ${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:${String(second).padStart(2,'0')}`};
}
/** DCE LH: day 09:00–11:30, 13:30–15:00 Asia/Shanghai; no night session. */
function sessionMode(){
  const t=shanghaiNow();
  if(t.weekday===0||t.weekday===6) return {mode:'off', reason:'周末休市', t};
  if((t.mins>=9*60 && t.mins<11*60+30) || (t.mins>=13*60+30 && t.mins<15*60))
    return {mode:'full', reason:'日盘交易时段自动刷新', t};
  return {mode:'off', reason:'非日盘时段（生猪无夜盘），暂停自动刷新', t};
}

function bySym(sym){return (snap.contracts||[]).find(c=>c.symbol===sym)||null;}
function datedContracts(){
  return (snap.contracts||[]).filter(c=>c.symbol!=='LH0').sort((a,b)=>a.symbol.localeCompare(b.symbol));
}

function setStatus(extra){
  const sess=sessionMode();
  const src=live?'文件行情':'缓存';
  document.getElementById('status').textContent=`${src} · ${snap.updatedAt||sess.t.label} · ${sess.reason}${extra?(' · '+extra):''}`;
}

function renderPos(){
  const pos=snap.position||FALLBACK.position;
  const c=bySym(pos.symbol);
  const mark=c&&c.last?c.last:null;
  const mult=pos.multiplier||16, lots=pos.lots||7, cost=pos.cost||12000;
  const pnl=mark!=null?(mark-cost)*mult*lots:null;
  const per100=100*mult*lots;
  const cls=pnl==null?'':(pnl>=0?'win':'loss');
  const sideTxt=pos.side==='long'?'多':'空';
  document.getElementById('posCard').innerHTML=`
    <h2>现有持仓</h2>
    <div class="row"><span>合约</span><strong>${pos.symbol} <span class="pill pos">${sideTxt} ${lots} 手</span></strong></div>
    <div class="row"><span>成本</span><strong>${fmt(cost,0)} 元/吨</strong></div>
    <div class="row"><span>标记（最新）</span><strong>${mark!=null?fmt(mark,0):'—'} 元/吨</strong></div>
    <div class="row"><span>合约乘数</span><span>${mult} 吨/手</span></div>
    <div class="row"><span>未实现盈亏</span><strong class="${cls}">${pnl==null?'—':yen(pnl)}</strong></div>
    <div class="note">公式：(标记 − ${cost}) × ${mult} × ${lots}。每涨跌 100 元/吨 ≈ ${yen(per100)}（${lots} 手）。</div>`;

  const main=bySym('LH2701')||(snap.contracts||[]).find(x=>x.isMain);
  document.getElementById('hero').innerHTML=`
    <div class="card"><div class="k">主力 LH2701</div><div class="v">${main?fmt(main.last,0):'—'}</div>
      <div class="tiny chg ${main&&main.change>=0?'up':'down'}">${main?(main.change>=0?'+':'')+fmt(main.change,0)+' · '+(main.changePct>=0?'+':'')+fmt(main.changePct,2)+'%':''}</div></div>
    <div class="card"><div class="k">持仓 LH2705 浮盈</div><div class="v ${cls}">${pnl==null?'—':yen(pnl)}</div>
      <div class="tiny">标记 ${mark!=null?fmt(mark,0):'—'} · 成本 ${fmt(cost,0)}</div></div>`;
}

function renderTable(){
  const rows=datedContracts();
  let html='';
  for(const c of rows){
    const cls=[c.isMain?'main':'',c.isPosition?'hold':''].filter(Boolean).join(' ');
    const tags=(c.isMain?'<span class="pill main">主力</span>':'')+(c.isPosition?'<span class="pill pos">持仓</span>':'');
    const chgCls=c.change>=0?'up':'down';
    html+=`<tr class="${cls}"><td>${c.symbol}${tags}</td>
      <td>${fmt(c.last,0)}</td>
      <td class="chg ${chgCls}">${c.change>=0?'+':''}${fmt(c.change,0)}<div class="tiny">${c.changePct>=0?'+':''}${fmt(c.changePct,2)}%</div></td>
      <td>${fmt(c.open,0)}</td><td>${fmt(c.high,0)}</td><td>${fmt(c.low,0)}</td>
      <td>${fmtInt(c.volume)}</td><td>${fmtInt(c.oi)}</td>
      <td>${fmt(c.bid,0)}/${fmt(c.ask,0)}</td></tr>`;
  }
  const cont=bySym('LH0');
  document.getElementById('tb').innerHTML=html||'<tr><td colspan="9">暂无数据</td></tr>';
  document.getElementById('tblFoot').textContent=cont
    ?`连续 LH0 最新 ${fmt(cont.last,0)}（对齐主力）。涨跌相对结算价。更新 ${snap.updatedAt||''}`
    :`涨跌相对结算价。更新 ${snap.updatedAt||''}`;
}

function renderChart(){
  const rows=datedContracts().filter(c=>c.last>0);
  if(rows.length<2){document.getElementById('chart').innerHTML='<div class="note">数据不足</div>';return;}
  const W=640,H=260,padL=48,padR=16,padT=16,padB=36;
  const iw=W-padL-padR, ih=H-padT-padB;
  const ys=rows.map(r=>r.last);
  const yMin=Math.min(...ys)*0.985, yMax=Math.max(...ys)*1.015;
  const X=i=>padL+(rows.length===1?iw/2:(i/(rows.length-1))*iw);
  const Y=v=>padT+((yMax-v)/(yMax-yMin||1))*ih;
  let d='';
  rows.forEach((r,i)=>{d+=(i?'L':'M')+X(i).toFixed(1)+','+Y(r.last).toFixed(1)+' ';});
  let xt='', dots='';
  rows.forEach((r,i)=>{
    const col=r.isPosition?'#f07178':(r.isMain?'#59a5ff':'#9aa8bf');
    xt+=`<text x="${X(i)}" y="${H-10}" fill="#9aa8bf" font-size="11" text-anchor="middle">${r.symbol.replace('LH','')}</text>`;
    dots+=`<circle cx="${X(i)}" cy="${Y(r.last)}" r="4" fill="${col}"/>`;
    dots+=`<text x="${X(i)}" y="${Y(r.last)-8}" fill="${col}" font-size="10" text-anchor="middle">${fmt(r.last,0)}</text>`;
  });
  const yTicks=[yMin,(yMin+yMax)/2,yMax];
  let yt='';
  for(const v of yTicks){
    yt+=`<text x="${padL-6}" y="${Y(v)+4}" fill="#9aa8bf" font-size="11" text-anchor="end">${Math.round(v)}</text>`;
  }
  document.getElementById('chart').innerHTML=`<svg class="curve" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${W}" height="${H}" fill="#0f1828"/>
    ${yt}
    <path d="${d}" fill="none" stroke="#59a5ff" stroke-width="2.5"/>
    ${dots}${xt}
  </svg>`;
}

function renderAll(){ setStatus(); renderPos(); renderTable(); renderChart(); }

async function pullQuotes(){
  const r=await fetch('quotes.json?_='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json();
  if(!d||!Array.isArray(d.contracts)||!d.contracts.length) throw new Error('empty');
  snap={
    updatedAt:d.updatedAt||shanghaiNow().label+' Asia/Shanghai',
    source:d.source||'sina',
    contracts:d.contracts,
    position:d.position||FALLBACK.position
  };
  live=true;
  renderAll();
}

async function smartRefresh(forceFull){
  const sess=sessionMode();
  const btn=document.getElementById('btn');
  try{
    if(btn){ btn.disabled=true; btn.textContent='刷新中…'; }
    await pullQuotes();
    if(sess.mode==='off' && !forceFull) setStatus('非交易时段 · 已读最新文件');
  }catch(e){
    live=false;
    document.getElementById('status').textContent='拉取失败（'+((e&&e.message)||'error')+'）· 仍显示缓存 '+(snap.updatedAt||'');
    renderAll();
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='刷新'; }
  }
}
function manualRefresh(){
  const btn=document.getElementById('btn');
  if(btn){ btn.disabled=true; btn.textContent='刷新中…'; }
  const hash=location.hash||'';
  const base=location.pathname.endsWith('/')?location.pathname:(location.pathname.replace(/[^/]+$/,'')||'/');
  location.replace(base + '?v=' + APP_VER + '&t=' + Date.now() + hash);
}

document.getElementById('btn').onclick=()=>manualRefresh();
renderAll();
smartRefresh(false);
if(timer) clearInterval(timer);
timer=setInterval(()=>{ const s=sessionMode(); if(s.mode!=='off') smartRefresh(false); else setStatus(); }, 300000);
setInterval(()=>{ if(sessionMode().mode==='off') setStatus(); }, 60000);
</script>
</body>
</html>
